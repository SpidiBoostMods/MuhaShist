name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Tests
        shell: bash
        run: bash ./gradlew check --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests-${{ matrix.os }}
          path: build/reports/tests/test
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Package
        shell: bash
        run: bash ./gradlew build --no-daemon && python3 scripts/package_release.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(sed -n 's/^mod_version=//p' gradle.properties)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "MuhaShist $version" --notes-file CHANGELOG.md \
            "build/libs/muhashist-1.21.4-v$version.jar" \
            "build/libs/muhashist-1.21.4-v$version-sources.jar" \
            "build/libs/muhashist-1.21.4-v$version-source.zip" \
            build/libs/muhashist-update.properties
